#
# Runs the tests on Windows and Linux, with and without the optional sf-pex-tools (pinned to its v0.1.0 tag). On a
# version tag (v0.1.0), builds the release zip with its SHA-256 checksum and publishes a GitHub release.
name: tests

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.9", "3.13"]
        pex: ["with", "without"]
        exclude:  # GitHub's current Ubuntu runner no longer offers 3.9; Windows still tests it
          - os: ubuntu-latest
            python: "3.9"
        include:
          - os: ubuntu-latest
            python: "3.10"
            pex: "with"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Get sf-pex-tools 0.1.0
        if: matrix.pex == 'with'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: taosecurity/sf-pex-tools
          ref: v0.1.0
          path: sf-pex-tools-dep
      - name: Unit tests
        shell: bash
        run: |
          if [ "${{ matrix.pex }}" = "with" ]; then export SF_PEX_TOOLS="$GITHUB_WORKSPACE/sf-pex-tools-dep"; fi
          python -I tests/test_sf_patch_day.py -v
      - name: Commands from AGENTS.md
        shell: bash
        run: |
          python -I sf-patch-day.py --version
          python -I sf-patch-day.py dlls --help
          python -I sf-patch-day.py drift check --help
      - name: Release zip builds
        run: python -I build_release.py
      - name: Keep the checksum
        if: matrix.python == '3.13' && matrix.pex == 'without'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: sha256-${{ matrix.os }}
          path: dist/*.sha256

  same-zip:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: sha256-*
      - name: Windows and Linux built the same zip
        run: |
          cat sha256-*/*.sha256
          test "$(cat sha256-ubuntu-latest/*.sha256)" = "$(cat sha256-windows-latest/*.sha256)"

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, same-zip]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"
      - name: Build the release zip and checksum
        run: python -I build_release.py --tag "$GITHUB_REF_NAME"
      - name: Check the checksum
        working-directory: dist
        run: sha256sum -c ./*.sha256
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/*.sha256
          --title "sf-patch-day ${GITHUB_REF_NAME#v}"
          --notes-file build/release-notes.md
          --verify-tag
